    <rect x="160" y="395" width="32" height="18" rx="4"/>
    <rect x="210" y="395" width="18" height="32" rx="4"/>
    <rect x="245" y="380" width="32" height="32" rx="5"/>
    <rect x="295" y="395" width="18" height="32" rx="4"/>
    <rect x="330" y="395" width="18" height="18" rx="4"/>
    <rect x="440" y="380" width="18" height="32" rx="4"/>

    <rect x="160" y="440" width="32" height="25" rx="4"/>
    <rect x="210" y="440" width="18" height="25" rx="4"/>
