    <!-- Glow Backdrop -->
    <rect x="-8" y="-8" width="136" height="136" rx="24" fill="#ffffff" filter="drop-shadow(0 4px 12px rgba(114, 72, 185, 0.45))"/>
    <rect x="0" y="0" width="120" height="120" rx="20" fill="url(#purpleGrad)"/>

    <!-- Google Forms Clipboard Icon -->
    <g transform="translate(30, 24) scale(0.6)">
      <!-- Board -->
      <rect x="10" y="18" width="80" height="96" rx="10" fill="#ffffff"/>
      <!-- Clip Top -->
