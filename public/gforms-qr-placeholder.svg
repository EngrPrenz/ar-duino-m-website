    <rect x="195" y="160" width="32" height="18" rx="4"/>
    <rect x="245" y="160" width="18" height="32" rx="4"/>
    <rect x="280" y="160" width="32" height="18" rx="4"/>
    <rect x="330" y="160" width="18" height="32" rx="4"/>
    <rect x="365" y="160" width="32" height="18" rx="4"/>
    <rect x="415" y="160" width="18" height="32" rx="4"/>
    <rect x="450" y="160" width="18" height="18" rx="4"/>

    <rect x="160" y="195" width="32" height="32" rx="5"/>
    <rect x="330" y="210" width="32" height="18" rx="4"/>
    <rect x="380" y="195" width="18" height="32" rx="4"/>
    <rect x="415" y="210" width="32" height="18" rx="4"/>
    <rect x="460" y="195" width="18" height="32" rx="4"/>

    <rect x="160" y="245" width="18" height="32" rx="4"/>
    <rect x="330" y="245" width="18" height="32" rx="4"/>
    <rect x="365" y="245" width="32" height="18" rx="4"/>
    <rect x="415" y="245" width="18" height="32" rx="4"/>
    <rect x="450" y="245" width="32" height="18" rx="4"/>

    <rect x="160" y="295" width="32" height="18" rx="4"/>
    <rect x="210" y="295" width="18" height="32" rx="4"/>
    <rect x="245" y="295" width="32" height="18" rx="4"/>
    <rect x="295" y="295" width="18" height="18" rx="4"/>
    <rect x="330" y="295" width="32" height="32" rx="5"/>
    <rect x="380" y="295" width="18" height="32" rx="4"/>
    <rect x="415" y="295" width="32" height="18" rx="4"/>
    <rect x="460" y="295" width="18" height="32" rx="4"/>

    <!-- Bottom Data Blocks -->
    <rect x="160" y="345" width="18" height="32" rx="4"/>
    <rect x="195" y="345" width="32" height="18" rx="4"/>
    <rect x="245" y="345" width="18" height="18" rx="4"/>
    <rect x="280" y="345" width="32" height="32" rx="5"/>
    <rect x="330" y="345" width="18" height="32" rx="4"/>
