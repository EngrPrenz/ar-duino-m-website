      <rect x="38" y="6" width="24" height="8" rx="3" fill="#D9C7F5"/>
      <!-- Form Lines & Checkboxes -->
      <circle cx="28" cy="42" r="5" fill="#7248B9"/>
      <rect x="40" y="39" width="40" height="6" rx="3" fill="#8B60D4"/>

      <circle cx="28" cy="62" r="5" fill="#7248B9"/>
      <rect x="40" y="59" width="34" height="6" rx="3" fill="#8B60D4"/>

      <circle cx="28" cy="82" r="5" fill="#7248B9"/>
      <rect x="40" y="79" width="38" height="6" rx="3" fill="#8B60D4"/>

      <circle cx="28" cy="102" r="5" fill="#49F996"/>
      <path d="M25 102 l 2 2 l 4 -4" stroke="#ffffff" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      <rect x="40" y="99" width="42" height="6" rx="3" fill="#8B60D4"/>
    </g>
  </g>
</svg>
