<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f3f4f8"/>
    </linearGradient>
    <!-- Purple Brand Gradient -->
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7248B9"/>
      <stop offset="100%" stop-color="#9B5FF5"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="500" height="500" rx="28" fill="url(#bgGrad)"/>

  <!-- Outer Corner Positioning Markers -->
  <!-- Top Left -->
  <rect x="35" y="35" width="105" height="105" rx="16" fill="#162133"/>
  <rect x="50" y="50" width="75" height="75" rx="10" fill="#ffffff"/>
  <rect x="65" y="65" width="45" height="45" rx="6" fill="url(#purpleGrad)"/>

  <!-- Top Right -->
  <rect x="360" y="35" width="105" height="105" rx="16" fill="#162133"/>
  <rect x="375" y="50" width="75" height="75" rx="10" fill="#ffffff"/>
  <rect x="390" y="65" width="45" height="45" rx="6" fill="url(#purpleGrad)"/>

  <!-- Bottom Left -->
  <rect x="35" y="360" width="105" height="105" rx="16" fill="#162133"/>
  <rect x="50" y="375" width="75" height="75" rx="10" fill="#ffffff"/>
  <rect x="65" y="390" width="45" height="45" rx="6" fill="url(#purpleGrad)"/>

  <!-- Alignment Marker Bottom Right -->
  <rect x="360" y="360" width="65" height="65" rx="10" fill="#162133"/>
  <rect x="373" y="373" width="39" height="39" rx="6" fill="#ffffff"/>
  <rect x="383" y="383" width="19" height="19" rx="3" fill="#162133"/>

  <!-- QR Pattern Grid Blocks (High density aesthetic QR simulation) -->
  <g fill="#162133">
