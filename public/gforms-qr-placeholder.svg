    <rect x="160" y="80" width="16" height="16" rx="3"/>
    <rect x="195" y="80" width="16" height="16" rx="3"/>
    <rect x="230" y="80" width="16" height="16" rx="3"/>
    <rect x="265" y="80" width="16" height="16" rx="3"/>
    <rect x="300" y="80" width="16" height="16" rx="3"/>
    <rect x="330" y="80" width="16" height="16" rx="3"/>

    <rect x="80" y="160" width="16" height="16" rx="3"/>
    <rect x="80" y="195" width="16" height="16" rx="3"/>
    <rect x="80" y="230" width="16" height="16" rx="3"/>
    <rect x="80" y="265" width="16" height="16" rx="3"/>
    <rect x="80" y="300" width="16" height="16" rx="3"/>
    <rect x="80" y="330" width="16" height="16" rx="3"/>

    <!-- Data Blocks Quadrant 1 -->
    <rect x="160" y="35" width="18" height="32" rx="4"/>
    <rect x="195" y="35" width="32" height="18" rx="4"/>
    <rect x="245" y="35" width="32" height="32" rx="5"/>
    <rect x="295" y="35" width="18" height="32" rx="4"/>
    <rect x="330" y="45" width="18" height="18" rx="4"/>

    <rect x="160" y="115" width="32" height="18" rx="4"/>
    <rect x="210" y="115" width="18" height="32" rx="4"/>
    <rect x="245" y="115" width="32" height="18" rx="4"/>
    <rect x="295" y="115" width="18" height="18" rx="4"/>
    <rect x="330" y="115" width="32" height="32" rx="5"/>

    <!-- Data Blocks Quadrant 2 -->
    <rect x="35" y="160" width="32" height="18" rx="4"/>
    <rect x="35" y="200" width="18" height="32" rx="4"/>
    <rect x="35" y="250" width="32" height="18" rx="4"/>
    <rect x="35" y="290" width="18" height="32" rx="4"/>

    <rect x="115" y="160" width="32" height="32" rx="5"/>
    <rect x="115" y="210" width="18" height="18" rx="4"/>
    <rect x="115" y="245" width="32" height="18" rx="4"/>
    <rect x="115" y="280" width="18" height="32" rx="4"/>
    <rect x="115" y="330" width="32" height="18" rx="4"/>

